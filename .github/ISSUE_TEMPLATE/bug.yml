name: Bug
description: Something plays wrong, throws, or stays silent
labels: [bug]
body:
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Package and version, adapter (Howler / Web Audio), React version if used, browser and OS (iOS version for Safari)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual. Say which package (e.g. `@zkmake/sound-scape`). A reproduction (StackBlitz, repo, or the `apps/` demo with a diff) makes this fast.
    validations:
      required: true
